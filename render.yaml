services:
  - type: web
    name: partsdesk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-lock.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && waitress-serve --url-scheme=https --listen=0.0.0.0:$PORT config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.2
      - key: PARTSDESK_DB
        value: postgres
      - key: PARTSDESK_DEBUG
        value: "0"
      - key: PARTSDESK_SECRET_KEY
        generateValue: true
      - key: PARTSDESK_TRUST_PROXY_SSL_HEADER
        value: "1"
      - key: PARTSDESK_TZ
        value: Africa/Lusaka
      - key: PGHOST
        fromDatabase:
          name: partsdesk-db
          property: host
      - key: PGDATABASE
        fromDatabase:
          name: partsdesk-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: partsdesk-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: partsdesk-db
          property: password
      - key: PGPORT
        fromDatabase:
          name: partsdesk-db
          property: port

databases:
  - name: partsdesk-db
    databaseName: partsdesk
    user: partsdesk
    plan: free
